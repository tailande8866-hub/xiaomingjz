[tool:pytest]
# pytest配置

pythonpath = .

# 测试文件模式
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记
markers =
    asyncio: mark test as async
    integration: mark test as integration test
    slow: mark test as slow running

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers

# 异步支持
asyncio_mode = auto
