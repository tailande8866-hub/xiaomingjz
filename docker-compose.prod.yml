version: '3.8'

# ==================== 生产环境 Docker Compose 配置 ====================
# 
# 特点：
#   - 使用 Nginx 反向代理 + SSL证书
#   - PostgreSQL 数据库（生产环境推荐）
#   - Redis 缓存
#   - 自动重启策略
#   - 数据持久化
#
# 使用方法：
#   docker-compose -f docker-compose.prod.yml up -d

services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: postgres:15-alpine
    container_name: saas-postgres
    environment:
      POSTGRES_DB: saas_accounting
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"  # 仅本地访问，不暴露到外网
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/pg_backup:/backups  # 备份目录
    networks:
      - saas-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d saas_accounting"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=64MB
      -c maintenance_work_mem=128MB

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: saas-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-ChangeMeRedis123}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"  # 仅本地访问
    volumes:
      - redisdata:/data
    networks:
      - saas-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeMeRedis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Bot 主服务 ====================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-bot
    env_file:
      - .env
    environment:
      # Telegram Bot配置
      - BOT_TOKEN=${BOT_TOKEN}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID}
      
      # 数据库配置
      - SHARED_DATABASE_URL=postgresql+asyncpg://${DB_USER:-admin}:${DB_PASSWORD:-ChangeMe123}@postgres/saas_accounting
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-admin}:${DB_PASSWORD:-ChangeMe123}@postgres/saas_accounting
      
      # Redis配置
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ChangeMeRedis123}@redis:6379
      
      # USDT支付配置
      - USDT_PAYMENT_ADDRESS=${USDT_PAYMENT_ADDRESS}
      - TRONSCAN_API_KEY=${TRONSCAN_API_KEY:-}
      
      # Webhook配置（使用Nginx反向代理）
      - WEBHOOK_URL=https://${DOMAIN:-localhost}/webhook
      - WEB_DOMAIN=https://${DOMAIN:-localhost}
      
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      
      # 时区配置
      - TZ=Asia/Shanghai
      
      # 安全配置
      - BOT_TOKEN_ENCRYPTION_KEY=${BOT_TOKEN_ENCRYPTION_KEY}
      - WEB_SECRET_KEY=${WEB_SECRET_KEY}
      
      # SaaS配置
      - PAYMENT_TEST_MODE=false
      - AUTHORIZATION_ENABLED=true
      
      # 性能优化
      - EVENT_WORKERS=3
      - MAX_RETRIES=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-network
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./instances:/app/instances
      - ./bot_instances:/app/bot_instances
      - ./backups:/app/backups
      - ./config:/app/config:ro
      - ./.env:/app/.env:ro

  # ==================== Nginx 反向代理 + SSL ====================
  nginx:
    image: nginx:alpine
    container_name: saas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - saas-network
    restart: always
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==================== 数据卷 ====================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

# ==================== 网络 ====================
networks:
  saas-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
